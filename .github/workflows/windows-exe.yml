name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm driver-settlement.spec

      - name: Smoke check executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/DriverSettlementAutomation.exe")) { throw "EXE was not created" }
          Get-Item "dist/DriverSettlementAutomation.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DriverSettlementAutomation-Windows
          path: dist/DriverSettlementAutomation.exe
          if-no-files-found: error
